<!DOCTYPE html>
<html lang="uz">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Player | TransferWindow</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at top left, #fee2e2, transparent 35%),
                radial-gradient(circle at bottom right, #e0e7ff, transparent 35%),
                #f8fafc;
        }

        .delete-card {
            width: 90%;
            max-width: 500px;
            background: white;
            padding: 45px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 25px 70px rgba(0,0,0,0.12);
        }

        .icon {
            width: 85px;
            height: 85px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #fee2e2;
            font-size: 40px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 15px;
        }

        p {
            color: #6b7280;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .player-name {
            color: #dc2626;
            font-weight: 800;
        }

        .buttons {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 800;
            border: none;
            cursor: pointer;
            font-size: 15px;
        }

        .cancel {
            background: #f1f5f9;
            color: #111827;
        }

        .delete {
            background: #dc2626;
            color: white;
        }

        .delete:hover {
            background: #b91c1c;
        }

        .cancel:hover {
            background: #e2e8f0;
        }

        @media(max-width: 500px) {

            .delete-card {
                padding: 30px 20px;
            }

            .buttons {
                flex-direction: column;
            }

        }

    </style>

</head>

<body>

<div class="delete-card">

    <div class="icon">
        🗑️
    </div>

    <h1>
        Delete Player?
    </h1>

    <p>
        Are you sure you want to delete
        <span class="player-name">
            {{ player.name }}
        </span>?

        <br>

        This action cannot be undone.
    </p>

    <form method="POST">

        {% csrf_token %}

        <div class="buttons">

            <a
                href="{% url 'detail' player.pk %}"
                class="btn cancel"
            >
                Cancel
            </a>

            <button
                type="submit"
                class="btn delete"
            >
                Delete Player
            </button>

        </div>

    </form>

</div>

</body>
</html>
